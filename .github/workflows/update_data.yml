name: Update Weekly Data

on:
  schedule:
    # Upstream rewrites the current week's statistics around 04:00 UTC; run after that.
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write

jobs:
  update_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fall back to the workflow token when no personal access token is configured.
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Fetch weekly download statistics
        run: python scripts/fetch_downloads.py

      - name: Fetch extension details and GitHub stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_extension_details.py

      - name: Fetch client library download statistics
        # Runs even if the previous step reported failures so one registry cannot block the others.
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_client_stats.py

      - name: Commit and Push Changes
        # Commit whatever was fetched even if one of the fetch steps reported failures.
        if: ${{ !cancelled() }}
        run: |
          git config --local user.email "dljtw98@gmail.com"
          git config --local user.name "Daniel ten Wolde"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "Update download data ($(date -u +%F))"
          git push origin HEAD:evidence
