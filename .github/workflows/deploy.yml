name: Deploy to GitHub Pages

on:
  push:
    branches:
      - evidence
  # Rebuild and publish the site after the nightly data update has pushed new data.
  # Pushes made by that workflow do not fire the push trigger above, so hook into
  # its completion instead.
  workflow_run:
    workflows: ["Update Weekly Data"]
    types: [completed]
    branches:
      - evidence
  workflow_dispatch:

jobs:
  build:
    # Only build when triggered directly, or when the data update actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - name: Build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: |
          npm run sources
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/${{ github.event.repository.name }}'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
